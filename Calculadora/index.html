<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <h3>Operaciones matemáticas</h3>
    </nav>
    <main>
        <div class="calculadora">
            <div class="calculadora_nros">
                <label for="nro1">Número 1:</label>
            <input type="number" id="nro1" name="nro1" placeholder="0">

                <label for="nro2">Número 2:</label>
                <input type="number" id="nro2" name="nro2" placeholder="0">
            </div>
            <div class="calculadora_btns">
                <input type="button" value="+" onclick="operaciones('+')">
                <input type="button" value="-" onclick="operaciones('-')">
                <input type="button" value="*" onclick="operaciones('*')">
                <input type="button" value="/" onclick="operaciones('/')">
                <input type="button" value="Clear" onclick="operaciones('clear')">
            </div>
            <div class="calculadora_resultado">
                <label for="resultado" id ="resultado" >Resultado:</label>
                <!-- <input typ
                 e="text" id="resultado" name="resultado" placeholder="0" > -->
        </div>
    </div>
</main>
<script src="script.js"></script>

</body>
</html>
