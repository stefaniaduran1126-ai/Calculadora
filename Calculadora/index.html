<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
</head>
<body>
    <nav>
        <h3>Operaciones matemáticas</h3>
    </nav>
    <main>
        <div class="calculadora">
            <div class="calculadora_nros">
                <label for="nro1">Número 1:</label>
            <input type="number" id="nro1" name="nro1" placeholder="0">

                <label for="nro2">Número 2:</label>
                <input type="number" id="nro2" name="nro2" placeholder="0">
            </div>
            <div class="calculadora_btns">
                <input type="button" value="+">
                <input type="button" value="-">
                <input type="button" value="*">
                <input type="button" value="/">
                <input type="button" value="Clear">  
                
            </div>
            <div class="calculadora_resultado">
                <label for="resultado">Resultado:</label>
                <input type="text" id="resultado" name="resultado" placeholder="0" readonly>
        </div>
    </div>
</main>

</body>
</html>
